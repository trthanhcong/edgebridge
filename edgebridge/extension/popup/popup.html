<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EdgeBridge</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <span class="dot" id="statusDot"></span>
        <h1>EdgeBridge</h1>
      </div>
      <span class="status-label" id="statusLabel">Disconnected</span>
    </header>

    <main class="content">
      <section class="field-group">
        <label for="host">Gateway host</label>
        <input type="text" id="host" placeholder="e.g. proxy.example.com or 203.0.113.5" autocomplete="off" />
      </section>

      <section class="field-group">
        <label for="port">Gateway port</label>
        <input type="number" id="port" placeholder="1080" min="1" max="65535" />
      </section>

      <section class="field-group">
        <label for="scheme">Proxy protocol</label>
        <select id="scheme">
          <option value="http">HTTP CONNECT (recommended)</option>
          <option value="socks5">SOCKS5</option>
        </select>
        <p class="hint" id="schemeHint">
          HTTP CONNECT supports username/password auth in the browser.
        </p>
      </section>

      <section class="field-group">
        <label for="authMode">Authentication</label>
        <select id="authMode">
          <option value="userpass">Username / Password</option>
          <option value="token">Token</option>
        </select>
      </section>

      <div id="userpassFields">
        <section class="field-group">
          <label for="username">Username</label>
          <input type="text" id="username" autocomplete="off" />
        </section>
        <section class="field-group">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="off" />
        </section>
      </div>

      <div id="tokenFields" hidden>
        <section class="field-group">
          <label for="token">Token</label>
          <input type="password" id="token" autocomplete="off" />
        </section>
      </div>

      <div class="actions">
        <button id="connectBtn" class="btn btn-primary">Connect</button>
        <button id="disconnectBtn" class="btn btn-secondary" hidden>Disconnect</button>
      </div>

      <div id="message" class="message" hidden></div>

      <section class="conn-info" id="connInfo" hidden>
        <div class="conn-row"><span>Connected to</span><span id="connTarget"></span></div>
        <div class="conn-row"><span>Protocol</span><span id="connScheme"></span></div>
      </section>
    </main>

    <footer class="footer">
      <span>For authorized use only.</span>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
